<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="로댕의 청동 조각 '생각하는 사람'을 360도로 살펴보며 단서를 찾는 중학생용 3D 미술 방탈출">
<title>생각하는 사람의 방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: full-bleed WebGL museum room, thin bronze HUD on the edges, notes open as paper cards. Single dark look on purpose (a night gallery). */
:root{
  --night:#0b0c10; --ink:#f1e9da; --muted:#bdb4a6; --gold:#d9a95b; --bronze:#b07a3e;
  --paper:#efe5cf; --paper-ink:#2c2418; --paper-line:#c4ab7c; --ok:#a8d89a; --bad:#ff9a8a;
  --panel:rgba(14,13,12,.84); --line:rgba(217,169,91,.42);
  --display:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  --ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Nanum Pen Script','Gowun Dodum',cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 95% at 50% 45%,transparent 55%,rgba(3,3,6,.6) 100%)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{position:fixed;z-index:5}
#hudTL{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:56vw}
.roomNo{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.roomName{font-family:var(--display);font-size:clamp(20px,2.6vw,28px);font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.8);line-height:1.2}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-current="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.tab.done{background:var(--gold);color:#22180a;border-color:var(--gold)}
.tab.done::after{content:" ✓"}
#hudTR{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:42vw}
.chip{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#timer{cursor:default;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#hudB{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:center;gap:10px}
#guide{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 18px;font-size:15px;line-height:1.55;text-align:center;text-wrap:balance}
.parts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.part{font-size:13px;padding:4px 10px;border-radius:999px;border:1px dashed rgba(217,169,91,.45);color:var(--muted);background:rgba(14,13,12,.6)}
.part.on{border-style:solid;border-color:var(--gold);background:var(--gold);color:#22180a}
#nextBtn{min-height:46px;padding:0 22px;border-radius:999px;border:none;background:var(--gold);color:#22180a;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 0 24px rgba(217,169,91,.45);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 40px rgba(217,169,91,.85)}}
#toast{position:fixed;z-index:15;left:50%;top:20%;transform:translate(-50%,0);background:rgba(14,13,12,.92);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-size:15px;line-height:1.5;max-width:min(520px,calc(100vw - 32px));text-align:center;pointer-events:none;transition:opacity .35s, transform .35s}
#toast.off{opacity:0;transform:translate(-50%,8px)}

/* light dial */
#lightPanel{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px 10px}
#lightPanel .lpTop{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
#lightPanel .lpTop b{color:var(--gold);font-weight:400;letter-spacing:.1em}
#lightPanel input{width:100%;accent-color:var(--gold);height:32px;margin:0}
#lightPanel .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* fade */
#fade{position:fixed;inset:0;z-index:30;background:#050506;opacity:0;pointer-events:none;transition:opacity .6s ease}
#fade.on{opacity:1;pointer-events:auto}

/* start screen */
#start{position:fixed;inset:0;z-index:25;display:flex;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,rgba(7,6,5,.9) 0%,rgba(7,6,5,.62) 42%,rgba(7,6,5,0) 78%)}
.startBox{max-width:520px;display:flex;flex-direction:column;gap:16px;padding-left:clamp(0px,5vw,64px);padding-block:24px}
.eyebrow{font-size:13px;letter-spacing:.24em;color:var(--gold)}
.startBox h1{font-family:var(--display);font-size:clamp(36px,6vw,64px);line-height:1.08;margin:0;font-weight:700;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.startBox h1 em{font-style:normal;color:var(--gold)}
.story{font-family:var(--display);font-size:17px;line-height:1.75;margin:0;color:#e8dfcd;max-width:34em}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field input{font:inherit;font-size:18px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:320px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:none;background:var(--gold);color:#22180a;font-weight:700;font-size:17px;cursor:pointer}
.btn:disabled{background:#4a3f30;color:#b9ab95;cursor:progress}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.small{min-height:40px;font-size:15px;padding:0 18px}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.cast{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;max-width:320px}
.cast i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a2a,#ffc45a);transition:width .2s}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,3,6,.45);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(580px,100%);max-height:calc(100dvh - 48px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.55);backdrop-filter:blur(6px);animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.card h2{font-family:var(--display);font-size:24px;margin:0 0 4px;text-wrap:balance}
.card .sub{font-size:13px;letter-spacing:.14em;color:var(--gold);margin-bottom:12px}
.card p{line-height:1.7;margin:8px 0;font-size:16px}
.card .task{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(217,169,91,.09);border-radius:0 10px 10px 0}
.card ul,.card ol{margin:8px 0;padding-left:20px;line-height:1.7}
.card.paper{background:var(--paper);color:var(--paper-ink);border-color:var(--paper-line);backdrop-filter:none;
  background-image:repeating-linear-gradient(transparent 0 37px,rgba(120,90,40,.16) 37px 38px)}
.card.paper .sub{color:#7f5418}
.hand{font-family:var(--hand);font-size:28px;line-height:1.36}
.hand mark{background:none;color:#8a3d12;border-bottom:2px solid rgba(138,61,18,.45)}
.src{font-size:12px;color:#6b5a3a;margin-top:6px}
.btnRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;background:rgba(255,255,255,.05);border-radius:12px;padding:12px 14px;margin:10px 0}
.fact dt{color:var(--gold)}
.fact dd{margin:0}
.timeline{list-style:none;padding:0!important;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.timeline li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline}
.timeline b{font-family:var(--display);color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}
.timeline span{font-size:14px;line-height:1.55}
.plaque{font-family:var(--display);text-align:center;padding:14px;border-radius:10px;background:linear-gradient(135deg,#5a3d22,#2e2012);color:#e9c98f;letter-spacing:.18em;box-shadow:inset 0 0 0 2px rgba(233,201,143,.25);margin:10px 0}
.plaque .y{font-size:40px;letter-spacing:.12em}
/* lock */
.lock{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px;margin:14px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.dial label{font-size:13px;color:var(--muted);text-align:center;line-height:1.35;min-height:2.7em}
.dial .ctl{display:flex;align-items:center;gap:6px}
.dial input{width:2.2em;text-align:center;font-family:var(--display);font-size:32px;background:transparent;border:none;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.dial.wide input{width:3.2em}
.dial button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.25);cursor:pointer;font-size:18px;flex:none}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hints{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.hints div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;line-height:1.6}
.hints h3{font-size:14px;color:var(--gold);margin:12px 0 2px;font-weight:400;letter-spacing:.08em}
.big{font-family:var(--display);font-size:clamp(32px,5vw,44px);margin:4px 0;color:var(--gold)}
@media (max-width:560px){
  #hudTL{max-width:62vw}
  .lock{gap:6px;grid-template-columns:1fr 1fr}
  .dial.wide{grid-column:1 / -1}
  .dial input{font-size:26px}
  .card{padding:20px 16px 16px}
  #lightPanel{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#nextBtn{animation:none}.card{animation:none}}
</style>
</head>
<body>

<canvas id="gl" aria-label="로댕의 생각하는 사람이 있는 3D 전시실. 끌어서 조각 주위를 돌고, 눌러서 조사합니다."></canvas>
<div id="vig"></div>

<div class="hud" id="hudTL" hidden>
  <div class="roomNo">밤의 전시실 · 단서 3개</div>
  <div class="roomName">생각하는 사람의 방</div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="hud" id="hudTR" hidden>
  <span class="chip" id="timer" aria-label="걸린 시간">00:00</span>
  <button class="chip" id="viewBtn" type="button">전체 보기</button>
  <button class="chip" id="lightBtn" type="button" aria-pressed="false">조명</button>
  <button class="chip" id="hintBtn" type="button">힌트</button>
  <button class="chip" id="soundBtn" type="button" aria-pressed="true">소리 켬</button>
</div>
<div class="hud" id="hudB" hidden>
  <button id="nextBtn" type="button" hidden>출구로 가기</button>
  <div id="guide"></div>
</div>
<div id="lightPanel" hidden>
  <div class="lpTop"><span>조명 방향</span><b id="lightDeg">정면</b></div>
  <input id="lightRange" type="range" min="-180" max="180" step="1" value="20" aria-label="조명 방향">
  <div class="ends"><span>왼쪽 뒤</span><span>왼쪽</span><span>정면</span><span>오른쪽</span><span>오른쪽 뒤</span></div>
</div>
<div id="toast" class="off" role="status"></div>

<div id="start">
  <div class="startBox">
    <div class="eyebrow">미술 방탈출 · 오귀스트 로댕</div>
    <h1><em>생각하는</em><br>사람의 방</h1>
    <p class="story">늦은 밤 미술관, 마지막 관람객인 여러분 뒤로 전시실 문이 철컥 잠겼어요. 방 한가운데에서 청동 조각 하나가 턱을 괸 채 생각에 잠겨 있어요. 조각과 이 방에 숨은 단서 세 개를 찾아 출구의 자물쇠를 여세요.</p>
    <label class="field" for="team">모둠 이름
      <input id="team" maxlength="12" placeholder="예: 청동 모둠" autocomplete="off">
    </label>
    <div class="row">
      <button class="btn" id="startBtn" type="button" disabled>조각을 주조하는 중…</button>
      <button class="btn ghost" id="resumeBtn" type="button" hidden>이어 하기</button>
    </div>
    <div class="cast" aria-hidden="true"><i id="castBar"></i></div>
    <div class="note">조각 주위를 끌어서 360도로 돌아보고, 조각을 눌러 자세히 살펴요.<br>태블릿 가로 화면 · 약 15~20분 · 소리를 켜면 더 좋아요.</div>
  </div>
</div>

<div id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div id="fade"></div>

<script>
/* Sculpting worker: SDF anatomy -> sparse surface nets mesh. Runs as a Web Worker (or in Node for tests). */
function SCULPT_WORKER(){
'use strict';
/* ---------- vec ---------- */
const V=(x,y,z)=>[x,y,z];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const nrm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l]};
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const madd=(o,...terms)=>{let r=o.slice();for(let i=0;i<terms.length;i+=2)r=add(r,mul(terms[i],terms[i+1]));return r};
/* rotate vector v about unit axis k by angle a (Rodrigues) */
function rot(v,k,a){const c=Math.cos(a),s=Math.sin(a);return add(add(mul(v,c),mul(cross(k,v),s)),mul(k,dot(k,v)*(1-c)))}
/* orthonormal frame from forward-ish z axis and an up hint */
function frame(o,z,yHint){z=nrm(z);let x=nrm(cross(yHint,z));const y=cross(z,x);return {o,x,y,z,p(a,b,c){return [o[0]+x[0]*a+y[0]*b+z[0]*c,o[1]+x[1]*a+y[1]*b+z[1]*c,o[2]+x[2]*a+y[2]*b+z[2]*c]},d(a,b,c){return nrm([x[0]*a+y[0]*b+z[0]*c,x[1]*a+y[1]*b+z[1]*c,x[2]*a+y[2]*b+z[2]*c])}}}
/* frame from explicit axes (x right, y up, z fwd) */
function frameXYZ(o,x,y){x=nrm(x);let z=nrm(cross(x,y));y=cross(z,x);return {o,x,y,z,p(a,b,c){return [o[0]+x[0]*a+y[0]*b+z[0]*c,o[1]+x[1]*a+y[1]*b+z[1]*c,o[2]+x[2]*a+y[2]*b+z[2]*c]},d(a,b,c){return nrm([x[0]*a+y[0]*b+z[0]*c,x[1]*a+y[1]*b+z[1]*c,x[2]*a+y[2]*b+z[2]*c])}}}

/* ---------- noise ---------- */
function hash3(x,y,z){let h=(x*374761393+y*668265263+z*1274126177)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h&0xffffff)/0xffffff}
function vnoise(x,y,z){const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);let fx=x-ix,fy=y-iy,fz=z-iz;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);fz=fz*fz*(3-2*fz);
  const a=hash3(ix,iy,iz),b=hash3(ix+1,iy,iz),c=hash3(ix,iy+1,iz),d=hash3(ix+1,iy+1,iz),e=hash3(ix,iy,iz+1),f=hash3(ix+1,iy,iz+1),g=hash3(ix,iy+1,iz+1),h=hash3(ix+1,iy+1,iz+1);
  const x1=a+(b-a)*fx,x2=c+(d-c)*fx,x3=e+(f-e)*fx,x4=g+(h-g)*fx;const y1=x1+(x2-x1)*fy,y2=x3+(x4-x3)*fy;return (y1+(y2-y1)*fz)*2-1}
function fbm(x,y,z,o){let s=0,a=.5;for(let i=0;i<o;i++){s+=a*vnoise(x,y,z);x=x*2.03+17.1;y=y*2.03+3.7;z=z*2.03+9.3;a*=.5}return s}

/* ---------- primitives ---------- */
/* t:0 roundcone, 1 ellipsoid, 2 sphere, 3 rounded box, 4 hair ellipsoid (noisy) */
function P_cone(a,b,r1,r2,k){const ba=sub(b,a),l2=dot(ba,ba),rr=r1-r2;return {t:0,a,ba,l2,rr,a2:l2-rr*rr,il2:1/l2,r1,r2,k:k==null?.02:k,post:0,bc:lerp(a,b,.5),br:Math.sqrt(l2)/2+Math.max(r1,r2)}}
function P_ell(c,ax,ay,az,rx,ry,rz,k){return {t:1,c,ax:nrm(ax),ay:nrm(ay),az:nrm(az),rx,ry,rz,k:k==null?.02:k,post:0,bc:c,br:Math.max(rx,ry,rz)}}
function P_sph(c,r,k){return {t:2,c,r,k:k==null?.02:k,post:0,bc:c,br:r}}
function P_box(c,ax,ay,az,hx,hy,hz,r,k){return {t:3,c,ax:nrm(ax),ay:nrm(ay),az:nrm(az),hx,hy,hz,r,k:k==null?.02:k,post:0,bc:c,br:Math.hypot(hx,hy,hz)+r}}
function evalP(P,x,y,z){
  switch(P.t){
  case 0:{const pax=x-P.a[0],pay=y-P.a[1],paz=z-P.a[2],ba=P.ba,l2=P.l2;const yy=pax*ba[0]+pay*ba[1]+paz*ba[2],zz=yy-l2;
    const qx=pax*l2-ba[0]*yy,qy=pay*l2-ba[1]*yy,qz=paz*l2-ba[2]*yy;const x2=qx*qx+qy*qy+qz*qz,y2=yy*yy*l2,z2=zz*zz*l2,rr=P.rr,a2=P.a2,il2=P.il2;
    const kk=Math.sign(rr)*rr*rr*x2;
    if(Math.sign(zz)*a2*z2>kk)return Math.sqrt(x2+z2)*il2-P.r2;
    if(Math.sign(yy)*a2*y2<kk)return Math.sqrt(x2+y2)*il2-P.r1;
    return (Math.sqrt(x2*a2*il2)+yy*rr)*il2-P.r1}

  if(L.n){const ce0=Math.cos(g.el);if(Math.sin(g.az)*ce0*L.n.x+Math.sin(g.el)*L.n.y+Math.cos(g.az)*ce0*L.n.z<.2){g.az=cam.pAz;g.el=cam.pEl;cam.vaz=cam.vel=0}}

function auPad(fr){if(!AU.ctx)return;const c=AU.ctx,now=c.currentTime;AU.pad.forEach(n=>{n.g.gain.cancelScheduledValues(now);n.g.gain.setTargetAtTime(0,now,.7);setTimeout(()=>{try{n.o.stop();n.o2.stop();n.l.stop()}catch(e){}},4000)});AU.pad=[];
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(AU.master);
  fr.forEach((f,i)=>{const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*1.003;g.gain.value=0;
    o.connect(g);o2.connect(g);g.connect(lp);l.frequency.value=.04+i*.027;lg.gain.value=.01;l.connect(lg);lg.connect(g.gain);o.start();o2.start();l.start();g.gain.setTargetAtTime(.022,now,2);AU.pad.push({o,o2,l,g})})}
function auChime(f,vol){if(!AU.ctx)return;const c=AU.ctx,n=c.currentTime;vol=vol||.16;[1,2.76,5.4].forEach((m,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol/(i+1.4),n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+2.6/(1+i*.7));o.connect(g);g.connect(AU.master);o.start(n);o.stop(n+2.8)})}
function auArp(base){[0,3,7,12,15].forEach((s,i)=>setTimeout(()=>auChime(base*Math.pow(2,s/12),.12),i*120))}
function auBuzz(){if(!AU.ctx)return;const c=AU.ctx,n=c.currentTime,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=98;f.type='lowpass';f.frequency.value=500;g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.0001,n+.35);o.connect(f);f.connect(g);g.connect(AU.master);o.start(n);o.stop(n+.4)}

const tweens=[];
function tween(dur,fn,done,delay){tweens.push({t0:performance.now()+(delay||0),dur:reduce?Math.min(dur,250):dur,fn,done})}
const easeOut=k=>1-Math.pow(1-k,3);
function runTweens(now){for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];if(now<tw.t0)continue;const k=Math.min(1,(now-tw.t0)/tw.dur);tw.fn(k);if(k>=1){tweens.splice(i,1);tw.done&&tw.done()}}}

$('lightBtn').onclick=()=>setLightOpen(!lightOpen);
$('hintBtn').onclick=()=>{if(!modalOpen)hintCard()};
$('soundBtn').onclick=()=>{AU.on=!AU.on;auInit();if(AU.master)AU.master.gain.setTargetAtTime(AU.on?.9:0,AU.ctx.currentTime,.2);$('soundBtn').textContent=AU.on?'소리 켬':'소리 끔';$('soundBtn').setAttribute('aria-pressed',String(AU.on))};
function lightLabel(d){const a=Math.abs(d);if(a<20)return '정면';const side=d>0?'오른쪽':'왼쪽';if(a<60)return side+' 앞';if(a<110)return side+' 옆';if(a<160)return side+' 뒤';return '뒤'}
$('lightRange').addEventListener('input',e=>{S.lightAz=+e.target.value;placeKey(S.lightAz);aimBeam();$('lightDeg').textContent=lightLabel(S.lightAz)});
const HINTS=[
 ['조각을 끌어서 빙 돌려 보세요. 등은 뒤쪽에서만 보여요.','얼굴을 누르면 가까이 다가가요. 가까이에서 이마, 코, 입을 하나씩 눌러 보세요.','주먹은 턱 밑의 오른손, 발가락은 바위 위 발끝에 있어요. 팔과 다리는 아무 쪽이나 괜찮아요. 모두 8곳이에요.'],
 ['조각 뒤쪽 벽의 커다란 청동 문을 누르면 가까이 갈 수 있어요.','문 위 가운데 튀어나온 턱 위에 작은 인물이 앉아 있어요. 누군가와 꼭 닮았죠?','맨 꼭대기 처마 위에 선 인물들도 눌러 보세요. 같은 조각이 몇 번 나오는지 세어 보세요.'],
 ['받침대 앞의 네모난 청동 명판을 누르면 조명 손잡이가 나타나요.','빛을 정면에서 비추면 글자에 그림자가 생기지 않아요. 옆에서 비춰 보세요.','조명 방향을 왼쪽 옆이나 오른쪽 옆(약 70~90도)으로 돌려 보세요. 명판에 새겨진 해가 네 자리 숫자예요.'],
 ['자물쇠는 몸의 부분 수, 꼭대기의 망령 수, 명판의 해 순서예요.']];
function hintCard(){const order=[[0,!S.doneA],[1,!S.doneB],[2,!S.plaque]].filter(x=>x[1]).map(x=>x[0]);if(!order.length)order.push(3);
  const NAMES=['온몸으로 생각하기','지옥의 문','빛으로 읽기','자물쇠'];const r=order[0];const shown=S.hintIdx[r];
  const list=HINTS[r].slice(0,shown).map((h,i)=>`<div><b>힌트 ${i+1}</b> · ${esc(h)}</div>`).join('')||'<div>아직 본 힌트가 없어요.</div>';
  const btns=[['닫기',closeModal,'ghost']];if(r===0)btns.unshift(['로댕의 말 다시 읽기',()=>quoteCard(),'ghost']);if(shown<HINTS[r].length)btns.push([shown?'다음 힌트 보기':'힌트 보기',()=>{S.hintIdx[r]++;S.hints++;save();renderHUD();hintCard()}]);
  openCard(`<div class="sub">힌트 · 지금 찾을 단서</div><h2>${NAMES[r]}</h2><div class="hints">${list}</div><p class="note">힌트를 볼 때마다 기록에 남아요. 지금까지 ${S.hints}번.</p>`,btns)}
function fade(mid){const f=$('fade');f.classList.add('on');setTimeout(()=>{mid();requestAnimationFrame(()=>setTimeout(()=>f.classList.remove('on'),60))},620)}

/* ================= input ================= */
const cv=$('gl');const ptrs=new Map();let down=null,pinch=null,lastMove=0;const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const pd=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
cv.addEventListener('pointerdown',e=>{if(modalOpen)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};cam.drag=true;cam.vaz=cam.vel=0;cv.classList.add('drag')}else if(ptrs.size===2){pinch={d:pd(),gd:cam.goal.d};down=null}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p){hover(e);return}const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1&&S.started){cam.auto=false;const k=2.6/innerHeight;cam.goal.az-=dx*k;cam.goal.el+=dy*k;const now=performance.now(),dtm=Math.max(8,now-lastMove)/1000;lastMove=now;cam.vaz=cam.vaz*.6-dx*k/dtm*.4;cam.vel=cam.vel*.6+dy*k/dtm*.4;if(down)down.moved+=Math.abs(dx)+Math.abs(dy)}
  else if(ptrs.size===2&&pinch){cam.goal.d=pinch.gd*pinch.d/pd()}});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){cam.drag=false;cv.classList.remove('drag');if(performance.now()-lastMove>90){cam.vaz=cam.vel=0}
    if(down&&down.moved<10&&performance.now()-down.t<600&&e.type==='pointerup')tap(e.clientX,e.clientY);down=null}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();if(!S.started)return;cam.auto=false;cam.goal.d=cam.goal.d*Math.exp(e.deltaY*.0012)},{passive:false});
function castAt(x,y){ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(hits,false);return h.length?h[0]:null}
function rockTap(p){pulseAt(p,0x9fb4ff);toast('거친 바위예요. 인물과 바위가 한 덩어리의 청동으로 부어져 만들어졌어요.')}
function tap(x,y){if(!S.started||modalOpen)return;cam.auto=false;const h=castAt(x,y);if(!h)return;const t=h.object.userData.type;
  if(S.escaped&&t!=='statue')return;
  if(t==='statue')tapStatue(h);
  else if(t==='rock'){const g=regionAt(h.point);if(g&&g.part==='toes'){tapStatue(h);return}rockTap(h.point)}
  else if(t==='gates'||t==='poet'||t==='shades')tapGates(t);
  else if(t==='plaque')tapPlaque();
  else if(t==='pedestal')toast('검은 화강암 받침대예요. 앞면의 청동 명판을 눌러 보세요.');
  else if(t==='door')tapDoor()}
let hovT=0;function hover(e){if(!S.started||touch||modalOpen)return;const now=performance.now();if(now-hovT<120)return;hovT=now;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const hs=ray.intersectObjects(hits.filter(o=>o!==thinkerMesh).concat(hoverProxy?[hoverProxy]:[]),false);const h=hs[0];cv.style.cursor=h&&h.object.userData.type!=='pedestal'?'pointer':''}
addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen){closeModal();return}if(modalOpen||!S.started)return;const s=.08;
  if(e.key==='ArrowLeft')cam.goal.az-=s*2;else if(e.key==='ArrowRight')cam.goal.az+=s*2;else if(e.key==='ArrowUp')cam.goal.el+=s;else if(e.key==='ArrowDown')cam.goal.el-=s;else if(e.key==='+'||e.key==='=')cam.goal.d*=.9;else if(e.key==='-')cam.goal.d*=1.1;else return;cam.auto=false});

/* ================= start / resume ================= */
let ready=false;
function begin(resume){auInit();auPad(PAD);const st=$('start');st.style.transition='opacity .8s';st.style.opacity='0';setTimeout(()=>st.hidden=true,800);
  if(!resume){const team=$('team').value.trim();S=freshState();S.team=team}
  S.started=true;save();cam.auto=false;startOffset=false;resize();$('lightRange').value=S.lightAz;placeKey(S.lightAz);aimBeam();$('lightDeg').textContent=lightLabel(S.lightAz);
  setView('main');renderHUD();if(!resume)setTimeout(introCard,700);else setTimeout(progressCheck,900)}
$('startBtn').onclick=()=>{if(ready)begin(false)};
$('team').addEventListener('keydown',e=>{if(e.key==='Enter'&&ready)begin(false)});
$('resumeBtn').onclick=()=>{const s=loadSaved();if(s&&ready){S=Object.assign(freshState(),s);$('team').value=S.team;begin(true)}};
if(loadSaved())$('resumeBtn').hidden=false;

// the scanned bronze when it can be fetched (the rock is part of the scan: only its base plate is sculpted), else the sculpted figure
loadScan().then(scan=>{if(scan)LM=SCAN_LM;
  return sculptAll(sculptJobs(!scan),p=>{$('castBar').style.width=(p*100).toFixed(1)+'%';$('startBtn').textContent=`조각을 주조하는 중… ${Math.round(p*100)}%`}).then(res=>Object.assign(res,scan||{}))}).then(res=>{
  addStatue(res);ready=true;$('startBtn').disabled=false;$('startBtn').textContent='탈출 시작';$('castBar').parentElement.style.visibility='hidden';if(DEBUG)window.__ready=true});

/* ================= loop ================= */
let last=performance.now(),timerShown=-1,paused=false;
function tick(now,dt){const t=now/1000;
  updateCam(dt);updateCast(dt);updatePlaque(dt);for(const f of anim)f(t,dt);runTweens(now);
  beamMat.uniforms.uOp.value=.045+.01*Math.sin(t*.7);
  if(S.started&&!S.escaped&&!document.hidden){S.elapsed+=dt;const s=Math.floor(S.elapsed);if(s!==timerShown){timerShown=s;$('timer').textContent=fmt(s);if(s%10===0)save()}}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){tick(now,dt);renderer.render(scene,camera)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
/* test hooks (only with ?debug) */
if(DEBUG)window.__game={pause:v=>{paused=v},step:(sec)=>{let n=performance.now();for(let i=0;i<sec*30;i++){n+=33;tick(n,1/30)}renderer.render(scene,camera)},S:()=>S,setView,tapPlaque,tapGates,tapDoor,cam,closeModal,regionAt,lm,setLight:d=>{S.lightAz=d;$('lightRange').value=d;placeKey(d);aimBeam()},faceView,camera,castAt,tap};
</script>
</body>
